 antarctica_decisions: "Expediciones antárticas"
 antarctic_decision_flavor: "La Antártida es un lugar frío e implacable. Hasta el siglo XX, el continente más austral del mundo era prácticamente desconocido. La tierra está dividida y reclamada por varias potencias mundiales, pero estas reclamaciones tienen poco peso diplomático, ya que las naciones prefieren centrarse en las regiones más habitables del mundo."
 #antarctica_decisions_desc: "$antarctic_decision_flavor$\n\nCon un §R50%§! de $ANTARCTIC_TENSION_HEADER$ podremos crear §HBases§!.\nCon un §R90%§! de $ANTARCTIC_TENSION_HEADER$ podremos reclamar §HGlaciares§! y §HBarreras de hielo§!, lo que nos permitirá conectar nuestras §HBases§! entre sí.\nAumentar nuestra §Gactividad§! en el continente incrementará la $ANTARCTIC_TENSION_HEADER$.\n\n$ANTARCTIC_TENSION_HEADER$ actual: [?ANTARCTIC_TENSION_VAR|%|0|-]"
