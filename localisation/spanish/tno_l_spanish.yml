#Events

 #News
 tno_news.1.t: "[ARG.GetName] gana la Guerra de las Órcadas del Sur"
 tno_news.1.desc: "A primera hora de esta mañana, delegados de [ENG.GetNameDef] y [ARG.GetNameDef] se reunieron en Montevideo para discutir una solución a la Guerra de las Órcadas del Sur. Esta conferencia de paz ha llevado a la decisión de que [ENG.GetNameDef] permita una presencia militar permanente [ARG.GetAdjective] en las Islas Órcadas del Sur.\n\nDado que la posición de [ENG.GetNameDef] en el Atlántico Sur se vuelve cada día más insostenible tras no lograr capturar las islas, el gobierno de [ENG.GetLeader] no ve otra opción que firmar el acuerdo tal como fue presentado."
 tno_news.1.a: "¡Esto es un desastre!" #eng
 tno_news.1.b: "Otra victoria para [ROOT.GetNameDef]." #arg
 tno_news.1.c: "Un acontecimiento interesante."

 tno_news.2.t: "[ENG.GetName] gana la Guerra de las Órcadas del Sur"
 tno_news.2.desc: "A primera hora de esta mañana, delegados de [ENG.GetNameDef] y [ARG.GetNameDef] se reunieron en Río de Janeiro para discutir el fin de la Guerra de las Órcadas del Sur. Esta conferencia de paz ha llevado a la decisión de que [ARG.GetNameDef] retire permanentemente todas sus fuerzas militares al sur del paralelo 60° y cese todas las actividades relacionadas con la Antártida.\n\nDado que las principales fuerzas de [ARG.GetNameDef] en las Órcadas del Sur se han rendido, [ARG.GetLeader] no ve otra opción que firmar el acuerdo tal como fue presentado."
 tno_news.2.a: "Otra victoria para [ROOT.GetNameDef]." #eng
 tno_news.2.b: "¡Esto es un desastre!" #arg
 tno_news.2.c: "Un acontecimiento interesante."

 tno_news.3.t: "Guerra de las Órcadas del Sur"
 tno_news.3.desc: "Aunque muchos deseaban una paz duradera en América del Sur, un reciente giro en los acontecimientos respecto a la militarización de las Islas Órcadas del Sur por parte de [ARG.GetNameDef], derivado de una disputa en el Atlántico Sur, se ha transformado en una guerra abierta.\n\nDado que tanto [ARG.GetNameDef] como [ENG.GetNameDef] se culpan mutuamente de iniciar la contienda, se sospecha que las fuerzas [ENG.GetAdjective] están preparando un asalto anfibio a las islas mientras se confirma que el ejército [ARG.GetAdjective] está reforzando sus defensas."
 tno_news.3.a: "Los aplastaremos." #eng
 tno_news.3.b: "Insensatos." #arg
 tno_news.3.c: "Tiempos interesantes, sin duda."

#Generic
 antarctica.2.t: "Instalación de investigación en [FROM.FROM.GetCapitalVictoryPointName]"
 antarctica.2.desc: "¿Qué tipo de instalación vamos a construir en [FROM.FROM.GetCapitalVictoryPointName]?"
 antarctica.2.a: "Una instalación terrestre es prudente para realizar pruebas en duras condiciones invernales."
 antarctica.2.b: "¿Alguien dijo Marina?"
 antarctica.2.c: "Una instalación de aerodinámica será una excelente adición a nuestra base."
 antarctica.2.d: "¡Ningún país encontrará jamás nuestros secretos nucleares aquí!"

#GER
 GER_antarctica.1.t: "La Expedición Antártica Alemana de [GetYear]"
 GER_antarctica.1.desc: "El objetivo principal del Schwabenland era de carácter económico, en particular el establecimiento de una estación ballenera y la adquisición de caladeros para una flota ballenera alemana con el fin de reducir la dependencia del Reich de la importación de aceites industriales, grasas y grasas alimentarias. Los preparativos se llevaron a cabo en estricto secreto, ya que la empresa también tenía la misión de evaluar la viabilidad de una futura ocupación de territorio antártico en la región comprendida entre los 20 ° Oeste y los 20 ° Este."
 GER_antarctica.1.a: "¡Parece una excelente idea!"
 GER_antarctica.1.b: "No podemos prescindir de los recursos."

 GER_antarctica.100.t: "¿Retirarse a Nueva Suabia?"
 GER_antarctica.100.desc: "A medida que las fuerzas enemigas continúan avanzando por el corazón de Alemania y la derrota se vislumbra cada vez más cerca, ha surgido la propuesta de evacuar activos militares y personal a Nueva Suabia.\nEl plan ha ganado apoyo entre altos cargos gubernamentales y militares. [TNO_leader_title_neuschwabenland_event] también han expresado su respaldo. ¿Deberíamos seguir adelante con ello?"
 GER_antarctica.100.a: "Comiencen los preparativos de inmediato."
 GER_antarctica.100.b: "¡Inaudito!"

 #Rename Humboldt Mountains base event
 GER_antarctica.101.t: "Nombre de Neu Berchtesgaden"
 GER_antarctica.101.desc: "TODO"
 GER_antarctica.101.a: "¡Ja, será Base 211!"
 GER_antarctica.101.b: "Nein, Neu Berchtesgaden es más apropiado."

#ARG
 #Begin of event chain. Event for Argentina when they take the 'Militarize the South Orkney Islands' decision.
 ARG_antarctica.1.t: "Militarizando las Islas Órcadas del Sur"
 ARG_antarctica.1.desc: "Argentina ha comunicado a la comunidad internacional el establecimiento de una base permanente en las Islas Órcadas del Sur. Hasta ahora, la estación ha dependido del Ministerio de Agricultura a la espera de una oportunidad para relevar a la administración civil y sustituirla por personal de la Armada Argentina.\nTransferir al personal podría permitirnos aumentar aún más la presencia argentina en la Antártida.\n¿Deberíamos hacerlo?"
 ARG_antarctica.1.a: "Relevar a la administración civil."
 ARG_antarctica.1.b: "Pensándolo mejor..."

 #Event for Argentina when United Kingdom doesn't do anything.
 ARG_antarctica.2.t: "[ENG.GetName] no interfiere en las Órcadas del Sur"
 ARG_antarctica.2.desc: "Tal como esperábamos, [ENG.GetNameDef] ha decidido no interferir en nuestra militarización de las Islas Órcadas del Sur."
 ARG_antarctica.2.a: "Todo según lo planeado."

 #Event for Argentina when United Kingdom responds harshly
 ARG_antarctica.3.t: "[ENG.GetName] protesta en las Órcadas del Sur"
 ARG_antarctica.3.desc: "[ENG.GetLeader] ha respondido a nuestras acciones, negándose a dar marcha atrás y amenazando con la guerra si violamos su soberanía sobre las Órcadas del Sur. La guerra podría ser inminente."
 ARG_antarctica.3.a: "¡Les daremos una lección!"
 ARG_antarctica.3.b: "No hay nada que podamos hacer, demos marcha atrás."

 #Event for United Kingdom when Argentina militarizes south orkney
 ARG_antarctica.4.t: "[ARG.GetName] militariza las Islas Órcadas del Sur"
 ARG_antarctica.4.desc: "TODO"
 ARG_antarctica.4.a: "Exigir que se detengan de inmediato."
 ARG_antarctica.4.b: "No podemos ocuparnos de esto ahora mismo."

 # Event for United Kingdom when Argentina refuses to leave South Orkney
 ARG_antarctica.5.t: "[ARG.GetName] se niega a abandonar las Islas Órcadas del Sur"
 ARG_antarctica.5.desc: "TODO"
 ARG_antarctica.5.a: "Recuperaremos las Órcadas del Sur."
 ARG_antarctica.5.b: "La guerra es inevitable, demos marcha atrás."

 #End of event chain. Event for United Kingdom when Argentina backs down after militarizing south orkney
 ARG_antarctica.6.t: "[ARG.GetName] da marcha atrás"
 ARG_antarctica.6.desc: "TODO"
 ARG_antarctica.6.a: "Bien, mantengan las islas desmilitarizadas." #Transfers the islands to Antarctic Anarchy
 ARG_antarctica.6.b: "Pongan una guarnición en la isla, por si acaso." #Makes the islands British

 #End of event chain. Event for Argentina when United Kingdom doesn't want war but protested.
 ARG_antarctica.7.t: "[ENG.GetName] cede las Islas Órcadas del Sur"
 ARG_antarctica.7.desc: "Ante el inminente estallido de una guerra entre nuestras dos naciones, [ENG.GetLeader] ha acordado permitir 'temporalmente' la presencia militar argentina en las islas."
 ARG_antarctica.7.a: "¡Excelentes noticias!"

 #Event for USA if Argentina takes the 'Demand East Base' decision.
 ARG_antarctica.8.t: "[ARG.GetName] exige la retirada de [1056.GetCapitalVictoryPointName]"
 ARG_antarctica.8.desc: "El presidente de [ARG.GetNonIdeologyName] nos ha entregado un ultimátum declarando que nuestra estación en la península Palmer es una violación de su integridad territorial. La carta añade que si no comenzáramos a retirarnos de [1056.GetCapitalVictoryPointName], tomarían el emplazamiento por la fuerza. ¿Cómo deberíamos responder?"
 ARG_antarctica.8.a: "No podemos arriesgarnos a enemistarnos con [ARG.GetNonIdeologyName]."
 ARG_antarctica.8.b: "¿Quiénes se creen que son?"

 #Event for Argentina if USA withdraws from East Base
 ARG_antarctica.9.t: "¡[USA.GetNameDefCap] abandona la Base Este!"
 ARG_antarctica.9.desc: "Al no ver otra opción para evitar la guerra, el presidente [USA.GetLeader] ha aceptado nuestro ultimátum y actualmente se encuentra en proceso de evacuar [1056.GetCapitalVictoryPointName]."
 ARG_antarctica.9.a: "¡Una gran victoria!" #Add 5 war support

 #Event for Argentina if USA refuses to leave East Base
 ARG_antarctica.10.t: "¡[USA.GetNameDefCap] se niega a abandonar la Base Este!"
 ARG_antarctica.10.desc: "Sin tomar en serio nuestro ultimátum, [USA.GetNameDef] ha condenado nuestras acciones y está preparada para defender la Base Este si estallan las hostilidades."
 ARG_antarctica.10.a: "Los [USA.GetAdjective]s son unos insensatos." #starts border war Argentina should have troops against the border already. USA will gain one poorly equipped 6 width division to defend.
 ARG_antarctica.10.b: "Quizás la guerra no convenga a los intereses de [ARG.GetNameDef]." #lose 50 pp

 #Event for USA if they lose East Base to Argentina #USA Defeat
 ARG_antarctica.11.t: "Caída de la Base Este"
 ARG_antarctica.11.desc: "¡La Base Este ha caído ante las tropas [ARG.GetAdjective]s! ¿Qué hacemos ahora?"
 ARG_antarctica.11.a: "¿Qué otra opción nos queda?" #Nothing happens
 ARG_antarctica.11.b: "Esto no ha terminado." #Gain Conquer (Focus) against Argentina and lose 10 war support

 #Event for Argentina if they take East Base #ARG Victory
 ARG_antarctica.12.t: "¡[ARG.GetName] toma por asalto la Base Este!"
 ARG_antarctica.12.desc: "Tras un enfrentamiento entre soldados [ARG.GetAdjective]s y [USA.GetAdjective]s en $SOUTH_GRAHAM_LAND$, se ha informado que [ARG.GetNameDef] ha capturado con éxito la Base Este."
 ARG_antarctica.12.a: "¡Una gran victoria!" #Argentina

 #Shared event for American victory #USA Victory #ARG Defeat #Stalemate
 ARG_antarctica.13.t: "¡Derrota [ARG.GetAdjective]!"
 ARG_antarctica.13.desc: "Tras un enfrentamiento entre soldados [ARG.GetAdjective]s y [USA.GetAdjective]s en $SOUTH_GRAHAM_LAND$, las tropas [USA.GetAdjective]s han logrado repeler al ejército [ARG.GetAdjective]."
 ARG_antarctica.13.a: "¡Una operación de manual!" #United States
 ARG_antarctica.13.b: "Lamentable." #Argentina

 #Event for Chile when Argentina constructs Esperanza Base
 ARG_antarctica.15.t: "[ARG.GetName] establece una base en la Península Trinidad"
 ARG_antarctica.15.desc: "¡[ARG.GetNameDef] ha roto descaradamente el statu quo en la Antártida al construir en secreto una base en la Península Trinidad! ¿Cómo deberíamos responder?"
 ARG_antarctica.15.a: "Desafiaremos su reclamación." #Allows creation of Antarctic bases. No need for a department or expedition.
 ARG_antarctica.15.b: "No es asunto nuestro." #Argentina will take North Trinity Coast and chile will not be able to construct Base Riquelme O'Higgins

#CHL
 CHL_antarctica.1.t: "La Expedición Antártica [CHL.GetAdjective]"
 CHL_antarctica.1.desc: "TODO"
 CHL_antarctica.1.a: "Deberíamos comenzar a trabajar en una estación."
 CHL_antarctica.1.b: "Esto no vale nuestro tiempo."
 CHL_antarctica.1.c: "Mantengan un ojo avizor ante una posible presencia [ARG.GetAdjective] o [ENG.GetAdjective]."
#FRA
 FRA_antarctica.1.t: "Reconocimiento de $FRA_ADELIE_LAND$"
 FRA_antarctica.1.desc: "Nuestra expedición a $FRA_ADELIE_LAND$ ha sido un éxito y se ha abierto la oportunidad de construir una base."
 FRA_antarctica.1.a: "¡Es una idea excelente!"
 FRA_antarctica.1.b: "No necesitamos esto."
#NOR
 NOR_antarctica.1.t: "Barcos balleneros llegan a la Antártida"
 NOR_antarctica.1.desc: "Nuestra expedición a $QUEEN_MAUD_LAND$ ha sido un éxito y se ha abierto la oportunidad de construir una estación ballenera o una base."
 NOR_antarctica.1.a: "¡Es una idea excelente!"
 NOR_antarctica.1.b: "No necesitamos esto."
#AST
 AST_antarctica.1.t: "Tercera Expedición Antártica de Mawson"
 AST_antarctica.1.desc: "TODO"
 AST_antarctica.1.a: "Seguiremos la propuesta de Evatt."
 AST_antarctica.1.b: "No tenemos interés en crear una base permanente por el momento."
#NZL
 
#USA
 USA_antarctica.1.t: "Tercera Expedición Antártica de Byrd"
 USA_antarctica.1.desc: "Un total de 125 hombres partieron de los Estados Unidos en los dos buques de la Expedición del Servicio Antártico de los Estados Unidos. La mayoría de los hombres que conformaban la expedición fueron reclutados de las filas militares, agencias civiles del gobierno e instituciones científicas.\nLos objetivos de la expedición fueron delineados en una orden del presidente [USA.GetLeader].\nEl presidente deseaba que se establecieran dos bases: la Base Este, en las inmediaciones de la isla Charcot o en la bahía Margarita; y la Base Oeste, en las proximidades de la Tierra del Rey Eduardo VII, pero si esto resultaba imposible, se debía investigar un emplazamiento en la bahía de las Ballenas, además de delimitar la línea costera continental entre los meridianos 72 ° O y 148 ° O."
 USA_antarctica.1.a: "Considerar el establecimiento de bases."
 USA_antarctica.1.b: "Ninguno de estos sitios es adecuado. Cancelar el proyecto."
#ENG
 
#Generic
 antarctica.1.t: "El regreso de nuestra expedición antártica"
 antarctica.1.desc: "Nuestra reciente expedición a la Antártida ha regresado con resultados prometedores. Han explorado gran parte de la región que nos interesa y han seleccionado posibles emplazamientos para estaciones permanentes.\nAhora bien, ¿deberíamos establecer una base en la Antártida?"
 antarctica.1.a: "Lo consideraremos."
 antarctica.1.b: "Pensándolo mejor..."
