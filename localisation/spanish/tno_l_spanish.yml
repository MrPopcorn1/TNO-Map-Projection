#Antarctica Country
 ZZZ_Antarctic_Anarchy: "Páramos Antárticos"
 ZZZ_Antarctic_Anarchy_desc: "La escasa vida que existe en la Antártida suele aferrarse a las costas, donde el mar proporciona al menos algún consuelo a sus sombrías vidas. Cuanto más se acerca uno al oscuro corazón del continente helado, más inhóspito se vuelve el terreno. Los sastrugis afilados como navajas, las grietas sin fondo y la ceguera por la nieve desafían toda existencia de vida. Solo los humanos recién llegados serían tan insensatos como para aventurarse en un lugar así."
