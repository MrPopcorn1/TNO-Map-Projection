#Events

 #News
 tno_news.1.t: "[ARG.GetName] vence a Guerra das Orcadas do Sul"
 tno_news.1.desc: "No início desta manhã, delegados de [ENG.GetNameDef] e [ARG.GetNameDef] se reuniram em Montevidéu para discutir uma solução para a Guerra das Orcadas do Sul. Esta conferência de paz levou à decisão de que [ENG.GetNameDef] deve permitir uma presença militar permanente [ARG.GetAdjective] nas Ilhas Orcadas do Sul.\n\nComo a posição de [ENG.GetNameDef] no Atlântico Sul continua a se tornar mais insustentável a cada dia após não conseguir capturar as ilhas, o governo de [ENG.GetLeader] não vê outra opção a não ser assinar o acordo conforme apresentado."
 tno_news.1.a: "Isto é um desastre!" #eng
 tno_news.1.b: "Mais uma vitória para [ROOT.GetNameDef]." #arg
 tno_news.1.c: "Um desdobramento interessante."

 tno_news.2.t: "[ENG.GetName] vence a Guerra das Orcadas do Sul"
 tno_news.2.desc: "No início desta manhã, delegados de [ENG.GetNameDef] e [ARG.GetNameDef] se reuniram no Rio de Janeiro para discutir o fim da Guerra das Orcadas do Sul. Esta conferência de paz levou à decisão de que [ARG.GetNameDef] deve retirar permanentemente todas as suas forças militares ao sul do paralelo 60° e cessar todas as atividades relacionadas à Antártida.\n\nCom as principais forças de [ARG.GetNameDef] nas Orcadas do Sul tendo se rendido, [ARG.GetLeader] não vê outra opção a não ser assinar o acordo conforme apresentado."
 tno_news.2.a: "Mais uma vitória para [ROOT.GetNameDef]." #eng
 tno_news.2.b: "Isto é um desastre!" #arg
 tno_news.2.c: "Um desdobramento interessante."

 tno_news.3.t: "Guerra das Orcadas do Sul"
 tno_news.3.desc: "Embora muitos desejassem uma paz duradoura na América do Sul, uma recente reviravolta referente à militarização das Ilhas Orcadas do Sul por [ARG.GetNameDef], decorrente de uma disputa no Atlântico Sul, transformou-se em uma guerra total.\n\nEnquanto [ARG.GetNameDef] e [ENG.GetNameDef] culpam um ao outro pelo início do conflito, suspeita-se que as forças [ENG.GetAdjective]s estejam preparando um ataque anfíbio às ilhas, enquanto o exército [ARG.GetAdjective] está confirmado em reforçar as defesas locais."
 tno_news.3.a: "Nós os esmagaremos." #eng
 tno_news.3.b: "Tolos." #arg
 tno_news.3.c: "Tempos realmente interessantes."

#Generic
 antarctica.2.t: "Instalação de pesquisa em [FROM.FROM.GetCapitalVictoryPointName]"
 antarctica.2.desc: "Que tipo de instalação vamos construir em [FROM.FROM.GetCapitalVictoryPointName]?"
 antarctica.2.a: "Uma instalação terrestre é prudente para testes em duras condições de inverno."
 antarctica.2.b: "Alguém disse Marinha?"
 antarctica.2.c: "Uma instalação de aerodinâmica será uma excelente adição à nossa base."
 antarctica.2.d: "Nenhum país jamais encontrará nossos segredos nucleares aqui!"

#GER
 GER_antarctica.1.t: "A Expedição Antártica Alemã de [GetYear]"
 GER_antarctica.1.desc: "O objetivo principal do Schwabenland era de natureza econômica, em particular o estabelecimento de uma estação baleeira e a aquisição de áreas de pesca para uma frota baleeira alemã, a fim de reduzir a dependência do Reich em relação à importação de óleos industriais, gorduras e gorduras alimentares. Os preparativos ocorreram sob estrito sigilo, já que o empreendimento também tinha a missão de avaliar a viabilidade de uma futura ocupação de território antártico na região entre 20° Oeste e 20° Leste."
 GER_antarctica.1.a: "Parece uma excelente ideia!"
 GER_antarctica.1.b: "Não podemos poupar os recursos."

 GER_antarctica.100.t: "Bater em retirada para a Nova Suábia?"
 GER_antarctica.100.desc: "Com o avanço contínuo das forças inimigas pelo coração da Alemanha e a derrota cada vez mais próxima, surgiu a proposta de evacuar ativos militares e pessoal para a Nova Suábia.\nO plano ganhou apoio de altos funcionários civis e militares. [TNO_leader_title_neuschwabenland_event] também expressaram apoio. Devemos seguir em frente com isso?"
 GER_antarctica.100.a: "Começar os preparativos imediatamente."
 GER_antarctica.100.b: "Um absurdo!"

 #Rename Humboldt Mountains base event
 GER_antarctica.101.t: "Nome de Neu Berchtesgaden"
 GER_antarctica.101.desc: "TODO"
 GER_antarctica.101.a: "Ja, será Base 211!"
 GER_antarctica.101.b: "Nein, Neu Berchtesgaden é mais apropriado."

#ARG
 #Begin of event chain. Event for Argentina when they take the 'Militarize the South Orkney Islands' decision.
 ARG_antarctica.1.t: "Militarizando as Ilhas Orcadas do Sul"
 ARG_antarctica.1.desc: "A Argentina comunicou à comunidade internacional o estabelecimento de uma base permanente nas Ilhas Orcadas do Sul. Até agora, a estação dependia do Ministério da Agricultura, até surgir a oportunidade de substituir a administração civil por pessoal da Marinha Argentina.\nTransferir o pessoal pode nos permitir aumentar ainda mais a presença argentina na Antártida.\nDevemos fazer isso?"
 ARG_antarctica.1.a: "Substituir a administração civil."
 ARG_antarctica.1.b: "Pensando bem..."

 #Event for Argentina when United Kingdom doesn't do anything.
 ARG_antarctica.2.t: "[ENG.GetName] não interfere nas Orcadas do Sul"
 ARG_antarctica.2.desc: "Como esperado, [ENG.GetNameDef] decidiu não interferir em nossa militarização das Ilhas Orcadas do Sul."
 ARG_antarctica.2.a: "Tudo conforme o planejado."

 #Event for Argentina when United Kingdom responds harshly
 ARG_antarctica.3.t: "[ENG.GetName] protesta contra nós nas Orcadas do Sul"
 ARG_antarctica.3.desc: "[ENG.GetLeader] respondeu às nossas ações, recusando-se a recuar e ameaçando com guerra caso violemos sua soberania sobre as Orcadas do Sul. A guerra pode ser iminente."
 ARG_antarctica.3.a: "Nós mostraremos a eles!"
 ARG_antarctica.3.b: "Não há nada que possamos fazer, recue."

 #Event for United Kingdom when Argentina militarizes south orkney
 ARG_antarctica.4.t: "[ARG.GetName] Militariza as Ilhas Orcadas do Sul"
 ARG_antarctica.4.desc: "TODO"
 ARG_antarctica.4.a: "Exigir que eles parem imediatamente."
 ARG_antarctica.4.b: "Não podemos lidar com isso agora."

 # Event for United Kingdom when Argentina refuses to leave South Orkney
 ARG_antarctica.5.t: "[ARG.GetName] se recusa a deixar as Ilhas Orcadas do Sul"
 ARG_antarctica.5.desc: "TODO"
 ARG_antarctica.5.a: "Tomaremos as Orcadas do Sul de volta."
 ARG_antarctica.5.b: "A guerra é inevitável, recue."

 #End of event chain. Event for United Kingdom when Argentina backs down after militarizing south orkney
 ARG_antarctica.6.t: "[ARG.GetName] recua"
 ARG_antarctica.6.desc: "TODO"
 ARG_antarctica.6.a: "Ótimo, mantenham as ilhas desmilitarizadas." #Transfers the islands to Antarctic Anarchy
 ARG_antarctica.6.b: "Coloquem uma guarnição na ilha, por precaução." #Makes the islands British

 #End of event chain. Event for Argentina when United Kingdom doesn't want war but protested.
 ARG_antarctica.7.t: "[ENG.GetName] entrega as Ilhas Orcadas do Sul"
 ARG_antarctica.7.desc: "Diante do risco iminente de guerra entre nossas nações, [ENG.GetLeader] concordou em permitir 'temporariamente' a presença militar argentina nas ilhas."
 ARG_antarctica.7.a: "Ótima notícia!"

 #Event for USA if Argentina takes the 'Demand East Base' decision.
 ARG_antarctica.8.t: "[ARG.GetName] exige a retirada de [1056.GetCapitalVictoryPointName]"
 ARG_antarctica.8.desc: "O Presidente de [ARG.GetNonIdeologyName] nos enviou um ultimato afirmando que nossa estação na Península Palmer viola sua integridade territorial. A carta declara ainda que, se não começarmos a nos retirar de [1056.GetCapitalVictoryPointName], eles tomarão o local à força. Como devemos responder?"
 ARG_antarctica.8.a: "Não podemos arriscar antagonizar [ARG.GetNonIdeologyName]."
 ARG_antarctica.8.b: "Quem eles pensam que são?"

 #Event for Argentina if USA withdraws from East Base
 ARG_antarctica.9.t: "[USA.GetNameDefCap] abandona a Base Leste!"
 ARG_antarctica.9.desc: "Sem outra escolha para evitar a guerra, o Presidente [USA.GetLeader] aceitou nosso ultimato e eles estão atualmente em processo de evacuação de [1056.GetCapitalVictoryPointName]."
 ARG_antarctica.9.a: "Uma grande vitória!" #Add 5 war support

 #Event for Argentina if USA refuses to leave East Base
 ARG_antarctica.10.t: "[USA.GetNameDefCap] se recusa a deixar a Base Leste!"
 ARG_antarctica.10.desc: "Sem levar nosso ultimato a sério, [USA.GetNameDef] condenou nossas ações e está pronta para defender a Base Leste caso as hostilidades comecem."
 ARG_antarctica.10.a: "Os [USA.GetAdjective]s são tolos." #starts border war Argentina should have troops against the border already. USA will gain one poorly equipped 6 width division to defend.
 ARG_antarctica.10.b: "Talvez a guerra não seja vantajosa para [ARG.GetNameDef]." #lose 50 pp

 #Event for USA if they lose East Base to Argentina #USA Defeat
 ARG_antarctica.11.t: "Queda da Base Leste"
 ARG_antarctica.11.desc: "A Base Leste caiu diante das tropas [ARG.GetAdjective]s! O que fazemos agora?"
 ARG_antarctica.11.a: "Que escolha nós temos?" #Nothing happens
 ARG_antarctica.11.b: "Isto não acabou." #Gain Conquer (Focus) against Argentina and lose 10 war support

 #Event for Argentina if they take East Base #ARG Victory
 ARG_antarctica.12.t: "[ARG.GetName] toma a Base Leste de assalto!"
 ARG_antarctica.12.desc: "Após um confronto entre soldados [ARG.GetAdjective]s e [USA.GetAdjective]s em $SOUTH_GRAHAM_LAND$, foi relatado que [ARG.GetNameDef] capturou com sucesso a Base Leste."
 ARG_antarctica.12.a: "Uma grande vitória!" #Argentina

 #Shared event for American victory #USA Victory #ARG Defeat #Stalemate
 ARG_antarctica.13.t: "Derrota [ARG.GetAdjective]!"
 ARG_antarctica.13.desc: "Após um confronto entre soldados [ARG.GetAdjective]s e [USA.GetAdjective]s em $SOUTH_GRAHAM_LAND$, as tropas [USA.GetAdjective]s conseguiram repelir o exército [ARG.GetAdjective]."
 ARG_antarctica.13.a: "Uma operação de manual!" #United States
 ARG_antarctica.13.b: "Lamentável." #Argentina

 #Event for Chile when Argentina constructs Esperanza Base
 ARG_antarctica.15.t: "[ARG.GetName] estabelece uma base na Península Trinity"
 ARG_antarctica.15.desc: "[ARG.GetNameDef] quebrou rudemente o status quo na Antártida ao construir secretamente uma base na Península Trinity! Como devemos responder?"
 ARG_antarctica.15.a: "Desafiaremos a reivindicação deles." #Allows creation of Antarctic bases. No need for a department or expedition.
 ARG_antarctica.15.b: "Não é da nossa conta." #Argentina will take North Trinity Coast and chile will not be able to construct Base Riquelme O'Higgins

#CHL
 CHL_antarctica.1.t: "A Expedição Antártica [CHL.GetAdjective]"
 CHL_antarctica.1.desc: "TODO"
 CHL_antarctica.1.a: "Devemos começar a trabalhar em uma estação."
 CHL_antarctica.1.b: "Isso não vale o nosso tempo."
 CHL_antarctica.1.c: "Fique de olho em qualquer presença [ARG.GetAdjective] ou [ENG.GetAdjective]."
#FRA
 FRA_antarctica.1.t: "Mapeando $FRA_ADELIE_LAND$"
 FRA_antarctica.1.desc: "Nossa expedição para $FRA_ADELIE_LAND$ foi bem-sucedida e abriu-se a oportunidade de construir uma base."
 FRA_antarctica.1.a: "Esta é uma excelente ideia!"
 FRA_antarctica.1.b: "Não precisamos disso."
#NOR
 NOR_antarctica.1.t: "Navios Baleeiros Chegam à Antártida"
 NOR_antarctica.1.desc: "Nossa expedição para $QUEEN_MAUD_LAND$ foi bem-sucedida e abriu-se a oportunidade de construir uma estação baleeira ou uma base."
 NOR_antarctica.1.a: "Esta é uma excelente ideia!"
 NOR_antarctica.1.b: "Não precisamos disso."
#AST
 AST_antarctica.1.t: "Terceira Expedição Antártica de Mawson"
 AST_antarctica.1.desc: "TODO"
 AST_antarctica.1.a: "Seguiremos a proposta de Evatt."
 AST_antarctica.1.b: "Não temos interesse em criar uma base permanente no momento."
#NZL
 
#USA
 USA_antarctica.1.t: "Terceira Expedição Antártica de Byrd"
 USA_antarctica.1.desc: "Um total de 125 homens partiram dos Estados Unidos nos dois navios da Expedição do Serviço Antártico dos Estados Unidos. A maioria dos homens que integravam a expedição foi recrutada das fileiras militares, agências civis do governo e instituições científicas.\nOs objetivos da expedição foram definidos em uma ordem do Presidente [USA.GetLeader].\nO Presidente desejava o estabelecimento de duas bases: a Base Leste, nas proximidades da Ilha Charcot ou na Baía Marguerite; e a Base Oeste, nas proximidades da Terra do Rei Edward VII, mas caso isso se mostrasse impossível, um local na Baía das Baleias deveria ser investigado, além do delineamento da linha costeira continental entre os meridianos 72° O e 148° O."
 USA_antarctica.1.a: "Considerar o estabelecimento de bases."
 USA_antarctica.1.b: "Nenhum desses locais é adequado. Cancelar o projeto."
#ENG
 
#Generic
 antarctica.1.t: "O Retorno de Nossa Expedição Antártica"
 antarctica.1.desc: "Nossa recente expedição à Antártida retornou com resultados promissores. Eles mapearam grande parte da região de nosso interesse e selecionaram possíveis locais para estações permanentes.\nAgora, devemos estabelecer uma base na Antártida?"
 antarctica.1.a: "Vamos considerar."
 antarctica.1.b: "Pensando bem..."
