#Antarctica Country
 ZZZ_Antarctic_Anarchy: "Ermos Antárticos"
 ZZZ_Antarctic_Anarchy_desc: "A pouca vida que existe na Antártida tende a se concentrar nas costas, onde o mar oferece ao menos algum alívio para suas vidas sombrias. Quanto mais alguém se aproxima do coração sombrio do continente congelado, mais inóspito o terreno se torna. Sastrugis afiados como navalhas, fendas sem fundo e cegueira pela neve desafiam a existência da vida. Apenas os humanos recém-chegados seriam tolos o suficiente para se aventurar em um lugar assim."
