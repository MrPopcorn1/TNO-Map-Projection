#Events

 #News
 tno_news.1.t: "[ARG.GetName] remporte la guerre des Orcades du Sud"
 tno_news.1.desc: "Plus tôt ce matin, des délégués de [ENG.GetNameDef] et de [ARG.GetNameDef] se sont réunis à Montevideo pour discuter d'une issue à la guerre des Orcades du Sud. Cette conférence de paix a abouti à la décision que [ENG.GetNameDef] autorise une présence militaire permanente [ARG.GetAdjective] dans les îles Orcades du Sud.\n\nComme la position de [ENG.GetNameDef] dans l'Atlantique Sud devient chaque jour plus intenable après avoir échoué à reprendre les îles, le gouvernement de [ENG.GetLeader] ne voit d'autre choix que de signer l'accord tel qu'il est présenté."
 tno_news.1.a: "C'est un désastre !" #eng
 tno_news.1.b: "Une autre victoire pour [ROOT.GetNameDef]." #arg
 tno_news.1.c: "Une évolution intéressante."

 tno_news.2.t: "[ENG.GetName] remporte la guerre des Orcades du Sud"
 tno_news.2.desc: "Plus tôt ce matin, des délégués de [ENG.GetNameDef] et de [ARG.GetNameDef] se sont réunis à Rio de Janeiro pour discuter de la fin de la guerre des Orcades du Sud. Cette conférence de paix a abouti à la décision que [ARG.GetNameDef] retire définitivement toutes ses forces militaires au sud du 60e parallèle sud et cesse toute activité liée à l'Antarctique.\n\nLes forces principales de [ARG.GetNameDef] dans les Orcades du Sud ayant capitulé, [ARG.GetLeader] ne voit d'autre choix que de signer l'accord tel qu'il est présenté."
 tno_news.2.a: "Une autre victoire pour [ROOT.GetNameDef]." #eng
 tno_news.2.b: "C'est un désastre !" #arg
 tno_news.2.c: "Une évolution intéressante."

 tno_news.3.t: "Guerre des Orcades du Sud"
 tno_news.3.desc: "Bien que beaucoup aient espéré une paix durable en Amérique du Sud, une récente tournure des événements concernant la militarisation des îles Orcades du Sud par [ARG.GetNameDef], issue d'un différend dans l'Atlantique Sud, s'est transformée en une guerre totale.\n\nAlors que [ARG.GetNameDef] et [ENG.GetNameDef] se rejettent mutuellement la responsabilité du conflit, les forces [ENG.GetAdjective]s sont soupçonnées de préparer un assaut amphibie sur les îles, tandis que l'armée [ARG.GetAdjective] renforce activement les défenses de l'archipel."
 tno_news.3.a: "Nous allons les écraser." #eng
 tno_news.3.b: "Des imbéciles." #arg
 tno_news.3.c: "Une époque bien intéressante, en effet."

#Generic
 antarctica.2.t: "Installation de recherche à [FROM.FROM.GetCapitalVictoryPointName]"
 antarctica.2.desc: "Quel type d'installation allons-nous construire à [FROM.FROM.GetCapitalVictoryPointName] ?"
 antarctica.2.a: "Une installation terrestre est prudente pour tester dans des conditions hivernales rigoureuses."
 antarctica.2.b: "Quelqu'un a dit la Marine ?"
 antarctica.2.c: "Une installation d'aérodynamique sera un excellent ajout à notre base."
 antarctica.2.d: "Aucun pays ne découvrira jamais nos secrets nucléaires ici !"

#GER
 GER_antarctica.1.t: "L'expédition antarctique allemande de [GetYear]"
 GER_antarctica.1.desc: "L'objectif principal du Schwabenland était de nature économique, en particulier l'établissement d'une station baleinière et l'acquisition de zones de pêche pour une flotte baleinière allemande afin de réduire la dépendance du Reich aux importations d'huiles industrielles et de matières grasses alimentaires. Les préparatifs se sont déroulés dans le plus grand secret, l'entreprise étant également chargée d'évaluer la faisabilité d'une future occupation du territoire antarctique dans la région comprise entre 20 ° Ouest et 20 ° Est."
 GER_antarctica.1.a: "Cela semble être une excellente idée !"
 GER_antarctica.1.b: "Nous ne pouvons pas nous permettre de gaspiller ces ressources."

 GER_antarctica.100.t: "Se replier vers la Nouvelle-Souabe ?"
 GER_antarctica.100.desc: "Alors que les forces ennemies continuent d'avancer à travers le cœur de l'Allemagne et que la défaite se profile de plus en plus, une proposition visant à évacuer des ressources militaires et du personnel vers la Nouvelle-Souabe a vu le jour.\nLe plan a reçu le soutien de hauts responsables gouvernementaux et militaires. [TNO_leader_title_neuschwabenland_event] ont également exprimé leur accord. Devons-nous aller de l'avant ?"
 GER_antarctica.100.a: "Commencez les préparatifs immédiatement."
 GER_antarctica.100.b: "Absurde !"

 #Rename Humboldt Mountains base event
 GER_antarctica.101.t: "Nom de Neu Berchtesgaden"
 GER_antarctica.101.desc: "TODO"
 GER_antarctica.101.a: "Ja, ce sera la Base 211 !"
 GER_antarctica.101.b: "Nein, Neu Berchtesgaden convient mieux."

#ARG
 #Begin of event chain. Event for Argentina when they take the 'Militarize the South Orkney Islands' decision.
 ARG_antarctica.1.t: "Militarisation des îles Orcades du Sud"
 ARG_antarctica.1.desc: "L'Argentine a communiqué à la communauté internationale l'établissement d'une base permanente sur les îles Orcades du Sud. La station dépendait jusqu'à présent du ministère de l'Agriculture jusqu'à ce qu'une occasion se présente de relever l'administration civile et de la remplacer par du personnel de la marine argentine.\nTransférer ce personnel pourrait nous permettre d'accroître davantage la présence argentine en Antarctique.\nDevons-nous le faire ?"
 ARG_antarctica.1.a: "Relever l'administration civile."
 ARG_antarctica.1.b: "À la réflexion..."

 #Event for Argentina when United Kingdom doesn't do anything.
 ARG_antarctica.2.t: "[ENG.GetName] n'intervient pas dans les Orcades du Sud"
 ARG_antarctica.2.desc: "Comme nous l'avions prévu, [ENG.GetNameDef] a décidé de ne pas interférer avec notre militarisation des îles Orcades du Sud."
 ARG_antarctica.2.a: "Tout se déroule selon le plan."

 #Event for Argentina when United Kingdom responds harshly
 ARG_antarctica.3.t: "[ENG.GetName] proteste contre nous dans les Orcades du Sud"
 ARG_antarctica.3.desc: "[ENG.GetLeader] a réagi à nos actions et a refusé de reculer, menaçant d'entrer en guerre si nous violons leur souveraineté sur les Orcades du Sud. La guerre pourrait être imminente."
 ARG_antarctica.3.a: "Nous allons leur montrer !"
 ARG_antarctica.3.b: "Nous ne pouvons rien faire d'autre, faisons marche arrière."

 #Event for United Kingdom when Argentina militarizes south orkney
 ARG_antarctica.4.t: "[ARG.GetName] militarise les îles Orcades du Sud"
 ARG_antarctica.4.desc: "TODO"
 ARG_antarctica.4.a: "Exiger qu'ils cessent immédiatement."
 ARG_antarctica.4.b: "Nous ne pouvons pas gérer cela en ce moment."

 # Event for United Kingdom when Argentina refuses to leave South Orkney
 ARG_antarctica.5.t: "[ARG.GetName] refuse de quitter les îles Orcades du Sud"
 ARG_antarctica.5.desc: "TODO"
 ARG_antarctica.5.a: "Nous allons reprendre les Orcades du Sud."
 ARG_antarctica.5.b: "La guerre est inévitable, faisons marche arrière."

 #End of event chain. Event for United Kingdom when Argentina backs down after militarizing south orkney
 ARG_antarctica.6.t: "[ARG.GetName] fait marche arrière"
 ARG_antarctica.6.desc: "TODO"
 ARG_antarctica.6.a: "Bien, gardez les îles démilitarisées." #Transfers the islands to Antarctic Anarchy
 ARG_antarctica.6.b: "Placez une garnison sur l'île, juste au cas où." #Makes the islands British

 #End of event chain. Event for Argentina when United Kingdom doesn't want war but protested.
 ARG_antarctica.7.t: "[ENG.GetName] cède les îles Orcades du Sud"
 ARG_antarctica.7.desc: "Face au risque d'éclatement d'une guerre entre nos deux nations, [ENG.GetLeader] a accepté d'autoriser 'temporairement' une présence militaire argentine sur les îles."
 ARG_antarctica.7.a: "Excellente nouvelle !"

 #Event for USA if Argentina takes the 'Demand East Base' decision.
 ARG_antarctica.8.t: "[ARG.GetName] exige l'évacuation de [1056.GetCapitalVictoryPointName]"
 ARG_antarctica.8.desc: "Le président de [ARG.GetNonIdeologyName] nous a remis un ultimatum indiquant que notre station dans la péninsule Palmer constitue une violation de leur intégrité territoriale. La lettre précise en outre que si nous ne commencions pas à évacuer [1056.GetCapitalVictoryPointName], ils prendraient de force le site eux-mêmes. Comment devons-nous réagir ?"
 ARG_antarctica.8.a: "Nous ne pouvons pas risquer de nous aliéner [ARG.GetNonIdeologyName]."
 ARG_antarctica.8.b: "Pour qui se prennent-ils ?"

 #Event for Argentina if USA withdraws from East Base
 ARG_antarctica.9.t: "[USA.GetNameDefCap] abandonne la Base Est !"
 ARG_antarctica.9.desc: "Ne voyant pas d'autre moyen d'éviter la guerre, le président [USA.GetLeader] a accepté notre ultimatum et ils sont actuellement en train d'évacuer [1056.GetCapitalVictoryPointName]."
 ARG_antarctica.9.a: "Une grande victoire !" #Add 5 war support

 #Event for Argentina if USA refuses to leave East Base
 ARG_antarctica.10.t: "[USA.GetNameDefCap] refuse de quitter la Base Est !"
 ARG_antarctica.10.desc: "Ne prenant pas notre ultimatum au sérieux, [USA.GetNameDef] a condamné nos actions et se tient prêt à défendre la Base Est si les hostilités venaient à éclater."
 ARG_antarctica.10.a: "Les [USA.GetAdjective]s sont bien imprudents." #starts border war Argentina should have troops against the border already. USA will gain one poorly equipped 6 width division to defend.
 ARG_antarctica.10.b: "La guerre n'est peut-être pas dans l'intérêt de [ARG.GetNameDef]." #lose 50 pp

 #Event for USA if they lose East Base to Argentina #USA Defeat
 ARG_antarctica.11.t: "Chute de la Base Est"
 ARG_antarctica.11.desc: "La Base Est est tombée aux mains des troupes [ARG.GetAdjective]s ! Que faisons-nous maintenant ?"
 ARG_antarctica.11.a: "Quel autre choix avons-nous ?" #Nothing happens
 ARG_antarctica.11.b: "Ce n'est pas la fin." #Gain Conquer (Focus) against Argentina and lose 10 war support

 #Event for Argentina if they take East Base #ARG Victory
 ARG_antarctica.12.t: "[ARG.GetName] prend d'assaut la Base Est !"
 ARG_antarctica.12.desc: "À la suite d'un affrontement entre soldats [ARG.GetAdjective]s et [USA.GetAdjective]s dans la région de $SOUTH_GRAHAM_LAND$, il a été rapporté que [ARG.GetNameDef] a capturé avec succès la Base Est."
 ARG_antarctica.12.a: "Une grande victoire !" #Argentina

 #Shared event for American victory #USA Victory #ARG Defeat #Stalemate
 ARG_antarctica.13.t: "Défaite [ARG.GetAdjective] !"
 ARG_antarctica.13.desc: "À la suite d'un affrontement entre soldats [ARG.GetAdjective]s et [USA.GetAdjective]s dans la région de $SOUTH_GRAHAM_LAND$, les troupes [USA.GetAdjective]s ont réussi à repousser l'armée [ARG.GetAdjective]."
 ARG_antarctica.13.a: "Une opération modèle !" #United States
 ARG_antarctica.13.b: "Regrettable." #Argentina

 #Event for Chile when Argentina constructs Esperanza Base
 ARG_antarctica.15.t: "[ARG.GetName] établit une base dans la Péninsule Trinité"
 ARG_antarctica.15.desc: "[ARG.GetNameDef] a grossièrement rompu le statu quo en Antarctique en construisant secrètement une base dans la Péninsule Trinité ! Comment devons-nous réagir ?"
 ARG_antarctica.15.a: "Nous allons contester leur revendication." #Allows creation of Antarctic bases. No need for a department or expedition.
 ARG_antarctica.15.b: "Cela ne nous regarde pas." #Argentina will take North Trinity Coast and chile will not be able to construct Base Riquelme O'Higgins

#CHL
 CHL_antarctica.1.t: "L'expédition antarctique [CHL.GetAdjective]"
 CHL_antarctica.1.desc: "TODO"
 CHL_antarctica.1.a: "Nous devrions commencer à travailler sur une station."
 CHL_antarctica.1.b: "Cela ne vaut pas notre temps."
 CHL_antarctica.1.c: "Gardez l'œil ouvert sur une éventuelle présence [ARG.GetAdjective] ou [ENG.GetAdjective]."
#FRA
 FRA_antarctica.1.t: "Exploration de la $FRA_ADELIE_LAND$"
 FRA_antarctica.1.desc: "Notre expédition en $FRA_ADELIE_LAND$ a été couronnée de succès et l'opportunité de construire une base s'est présentée."
 FRA_antarctica.1.a: "C'est une excellente idée !"
 FRA_antarctica.1.b: "Nous n'avons pas besoin de cela."
#NOR
 NOR_antarctica.1.t: "Des baleiniers atteignent l'Antarctique"
 NOR_antarctica.1.desc: "Notre expédition en $QUEEN_MAUD_LAND$ a été couronnée de succès et l'opportunité de construire une station baleinière ou une base s'est présentée."
 NOR_antarctica.1.a: "C'est une excellente idée !"
 NOR_antarctica.1.b: "Nous n'avons pas besoin de cela."
#AST
 AST_antarctica.1.t: "Troisième expédition antarctique de Mawson"
 AST_antarctica.1.desc: "TODO"
 AST_antarctica.1.a: "Nous allons suivre la proposition d'Evatt."
 AST_antarctica.1.b: "Nous n'avons aucun intérêt à créer une base permanente pour le moment."
#NZL
 
#USA
 USA_antarctica.1.t: "Troisième expédition antarctique de Byrd"
 USA_antarctica.1.desc: "Un total de 125 hommes ont quitté les États-Unis à bord des deux navires de l'expédition du service antarctique des États-Unis. La plupart des hommes composant l'expédition ont été recrutés dans les rangs militaires, au sein d'organismes gouvernementaux civils et d'institutions scientifiques.\nLes objectifs de l'expédition ont été définis par un ordre du président [USA.GetLeader].\nLe président souhaitait que deux bases soient établies : la Base Est, aux abords de l'île Charcot ou dans la baie Marguerite ; et la Base Ouest, aux abords de la Terre du Roi-Édouard-VII, mais si cela s'avérait impossible, un site sur la baie des Baleines devait être exploré, ainsi que la délimitation du littoral continental entre les méridiens 72 ° O et 148 ° O."
 USA_antarctica.1.a: "Envisager l'établissement de bases."
 USA_antarctica.1.b: "Aucun de ces sites ne convient. Mettre fin au projet."
#ENG
 
#Generic
 antarctica.1.t: "Le retour de notre expédition antarctique"
 antarctica.1.desc: "Notre récente expédition en Antarctique est revenue avec des résultats prometteurs. Ils ont exploré une grande partie de la région qui nous intéresse et ont sélectionné des sites potentiels pour des stations permanentes.\nMaintenant, devrions-nous établir une base en Antarctique ?"
 antarctica.1.a: "Nous allons y réfléchir."
 antarctica.1.b: "À la réflexion..."
