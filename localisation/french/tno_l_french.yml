#Decisions
 #Generic Decisions
 antarctica_decisions: "Expéditions antarctiques"
 antarctic_decision_flavor: "L'Antarctique est un endroit froid et impitoyable. Jusqu'au XXe siècle, le continent le plus méridional du monde était largement méconnu. Les terres sont divisées et revendiquées par les diverses puissances du monde, mais ces revendications ont peu de poids diplomatique, car les nations préfèrent se concentrer sur les régions les plus habitables du globe."
 #antarctica_decisions_desc: "$antarctic_decision_flavor$\n\nÀ §R50%§! de $ANTARCTIC_TENSION_HEADER$, nous pourrons créer des §HBases§!.\nÀ §R90%§! de $ANTARCTIC_TENSION_HEADER$, nous pourrons revendiquer des §HGlaciers§! et des §HBarrières de glace§!, nous permettant de relier nos §HBases§! entre elles.\nAugmenter notre §Gactivité§! sur le continent augmentera la $ANTARCTIC_TENSION_HEADER$.\n\n$ANTARCTIC_TENSION_HEADER$ actuelle : [?ANTARCTIC_TENSION_VAR|%|0|-]"
