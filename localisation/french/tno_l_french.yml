#Antarctica Country
 ZZZ_Antarctic_Anarchy: "Terres désolées antarctiques"
 ZZZ_Antarctic_Anarchy_desc: "Le peu de vie qui subsiste en Antarctique a tendance à rester sur les côtes, où la mer apporte un semblant de secours à leur existence austère. Plus on s'approche du cœur obscur du continent glacé, plus le terrain devient inhospitalier. Sastrugis acérés comme des rasoirs, crevasses sans fond et cécité des neiges s'opposent à toute existence de vie. Seuls les humains fraîchement arrivés seraient assez fous pour s'aventurer dans un tel endroit."
 ZZZ_hidden: "$ZZZ_Antarctic_Anarchy$"
 ZZZ_no_authority: "Aucune autorité"
